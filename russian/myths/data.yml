- name: Ахиллесова пята
  meaning: Уязвимое место или слабость человека, в остальном сильного и непобедимого.
  origin: Мать Ахилла, богиня Фетида, окунула его в священные воды реки Стикс, держа за пятку. Пята осталась единственным незащищенным местом, куда его и поразил стрелой Парис.
  example: Для опытного переговорщика страх публичных выступлений оставался настоящей ахиллесовой пятой.

- name: Ящик Пандоры
  meaning: Источник многочисленных бед, несчастий и неприятностей, открытый по неосторожности.
  origin: Зевс отправил на Землю первую женщину Пандору с сосудом (впоследствии названным ящиком), запретив его открывать. Из любопытства Пандора открыла крышку, выпустив на свободу все человеческие пороки и болезни.
  example: Решение открыть доступ к архивам обернулось ящиком Пандоры, и последствия оказались необратимыми.

- name: Троянский конь
  meaning: Тайный, коварный замысел; подарок с вредоносным подвохом.
  origin: Греки построили огромного деревянного коня, спрятав внутри воинов, и оставили у стен Трои под видом дара. Троянцы затащили коня в город, а ночью греческие воины вылезли и открыли ворота своей армии.
  example: Бесплатная подписка оказалась троянским конём, который незаметно собирал данные пользователей.

- name: Авгиевы конюшни
  meaning: Крайняя запущенность, беспорядок или загрязнение, требующие огромных усилий для уборки.
  origin: Царь Авгий годами не чистил свои огромные скотные дворы. Геракл очистил их за один день, направив в конюшни русла двух бурлящих рек — Альфея и Пенея.
  example: Бухгалтерия компании представляла собой авгиевы конюшни, и новому главбуху пришлось разбирать их несколько месяцев.

- name: Сизифов труд
  meaning: Бесконечная, тяжелая и совершенно безрезультатная работа.
  origin: "За обман богов царь Сизиф был наказан в Аиде: он вечно катит на вершину горы тяжелый камень, который перед самым пиком срывается и падает вниз."
  example: Переписывать отчёт заново каждую неделю — настоящий сизифов труд.

- name: Нить Ариадны
  meaning: Способ или путеводная нить, помогающая найти выход из сложной ситуации.
  origin: Ариадна дала царевичу Тесею клубок ниток, когда тот отправился в Критский лабиринт убивать Минотавра. Разматывая нить, Тесей смог благополучно найти дорогу назад.
  example: В незнакомом городе карта в телефоне стала для нас нитью Ариадны.

- name: Дамоклов меч
  meaning: Постоянно нависшая, близкая и грозная опасность при видимом благополучии.
  origin: Сиракузский тиран Дионисий посадил на свой престол льстеца Дамокла, но повесил над его головой острый меч на конском волосе, показав, насколько хрупка и опасна власть.
  example: Над проектом постоянно висел дамоклов меч дедлайна.

- name: Яблоко раздора
  meaning: Причина споров, вражды и серьезных разногласий.
  origin: Богиня раздора Эрида подбросила на пир яблоко с надписью «Прекраснейшей». За него заспорили Гера, Афина и Афродита, что в итоге привело к Троянской войне.
  example: Наследство деда стало яблоком раздора для всей семьи.

- name: Прокрустово ложе
  meaning: Искусственная мерка или формальные рамки, под которые насильственно подгоняют явления.
  origin: "Разбойник Прокруст укладывал путников на свое ложе: тем, кто был длиннее, он обрубал ноги, а коротких — вытягивал, пока они не подходили под размер кровати."
  example: Не стоит подгонять живую дискуссию под прокрустово ложе регламента.

- name: Кануть в Лету
  meaning: Навсегда исчезнуть, бесследно уйти в прошлое или быть преданным забытью.
  origin: Лета — река забвения в подземном царстве Аида. Души умерших, испившие из нее воды, забывали всю свою земную жизнь.
  example: Старые обиды давно канули в Лету, и мы снова общаемся.
